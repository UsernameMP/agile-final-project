name: GeoMesh V4 smoke tests
on:
  push:
    branches: [gh-pages]
    paths:
      - 'v4/**'
      - '.github/workflows/geomesh-v4-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physics and Pareto consistency
        run: node v4/test_v4.js
      - name: UI smoke (initial render, diameter 90, recalculate)
        run: node v4/test_ui.js
